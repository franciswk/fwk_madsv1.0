[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ef"
textColor = "#0b0b0b"
borderColor = "#e4e2dc"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
font = "sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a"]
dataframeHeaderBackgroundColor = "#f3f2ef"

[server]
headless = true

[browser]
gatherUsageStats = false
